<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Yak</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: #0C1A17; color: #F4ECDD; font: 17px/1.7 -apple-system, system-ui, "Segoe UI", sans-serif; text-align: center; }
    a { color: #D9B26F; font-weight: 600; }
    .en { opacity: .8; }
  </style>
</head>
<body>
  <main>
    <p>جارٍ الفتح…</p>
    <p class="en" lang="en" dir="ltr">Opening…</p>
    <p id="manual" hidden><a id="link" href="#">افتح · Open</a></p>
  </main>
  <script>
    // Yak's old front door: since 14 Nov 2026 the platform lives at its own address, yak-kw.com. Every path
    // forwards to the same path there, so codes printed with this address keep working. config.json is no
    // longer read (the PC test platform still rewrites it when it starts; that changes nothing here).
    (function () {
      var path = location.pathname + location.search + location.hash;
      var target = 'https://yak-kw.com' + (path.charAt(0) === '/' ? path : '/' + path);
      document.getElementById('link').href = target;
      location.replace(target);
      setTimeout(function () { document.getElementById('manual').hidden = false; }, 3000);
    })();
  </script>
</body>
</html>
