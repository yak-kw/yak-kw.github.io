<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Yak</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: #0C1A17; color: #F4ECDD; font: 17px/1.7 -apple-system, system-ui, "Segoe UI", sans-serif; text-align: center; }
    a { color: #D9B26F; font-weight: 600; }
    .en { opacity: .8; }
  </style>
</head>
<body>
  <main>
    <p>جارٍ الفتح…</p>
    <p class="en" lang="en" dir="ltr">Opening…</p>
    <p id="manual" hidden><a id="link" href="#">افتح · Open</a></p>
  </main>
  <script>
    // Yak's fixed front door: it forwards to the same path on the platform, whose address is in config.json.
    // Only the path of this site is added to that address, so it can't send anyone to another website.
    (function () {
      var path = location.pathname + location.search + location.hash;
      var manual = document.getElementById('manual');
      fetch('/config.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (cfg) {
          var base = String(cfg.platform || '').replace(/\/+$/, '');
          if (!/^https:\/\/[a-z0-9.-]+$/i.test(base)) throw new Error('no platform address');
          var target = base + (path.charAt(0) === '/' ? path : '/' + path);
          document.getElementById('link').href = target;
          location.replace(target);
          setTimeout(function () { manual.hidden = false; }, 3000);
        })
        .catch(function () { manual.hidden = false; });
    })();
  </script>
</body>
</html>
